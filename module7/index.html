<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form action="">
     <label for="firstname">FirstName:</label><br>
     <input type="text" id="firstname" name="firstname"><br>


     <label for="lastname">LastName:</label><br>
     <input type="text" id="lastname" name="lastname"><br>


<label for="email">email:</label><br>
     <input type="email" id="email" name="email"><br>


<label for="password">password:</label><br>
     <input type="password" id="password" name="password"><br>

<label for="gender">Gender:</label><br>
<input type="radio" id="male" name="gender" value="male">
<label for="male">Male:</label><br>
<input type="radio" id="female" name="gender" value="female">
<label for="female">Female:</label><br>

<label for="hobbies">Hobbies:</label><br>
<input type="checkbox"id="gaming" name="gaming" value="gaming">
<label for="gaming">Gaming:</label><br>


<input type="checkbox"id="football" name="football" value="football">
<label for="football">football:</label><br>


<input type="checkbox"id="swim" name="swim" value="swim">
<label for="swim">swim:</label><br>

<label for="pet">choose a pet:</label>
<select name="pet" id="pet">
<option value="Dog">Dog:</option>
<option value="cat">cat:</option>
<option value="parrot">parrot:</option>



</select>


<textarea name="message" id="message" rows="10" cols="20"></textarea>

<input type="submit"name="submit"id="submit">







</form>
</body>
</html>
